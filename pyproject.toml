[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perturbation-baseline-gate"
version = "0.1.0"
description = "Baseline gate for perturbation-response prediction: mean, additive and linear baselines on held-out genetic perturbations (Norman et al. 2019), with a paired-bootstrap test for candidate models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The authors" }]
keywords = ["perturb-seq", "virtual cell", "baseline", "benchmark", "perturbation prediction"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
data = ["h5py>=3.8"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
pbgate = "pbgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pbgate"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
